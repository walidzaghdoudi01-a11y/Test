version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: audit-postgres
    environment:
      POSTGRES_USER: audituser
      POSTGRES_PASSWORD: auditpass
      POSTGRES_DB: auditdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audituser"]
      interval: 5s
      timeout: 5s
      retries: 5

  audit-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: audit-service
    environment:
      DATABASE_URL: postgresql://audituser:auditpass@postgres:5432/auditdb
      LOG_LEVEL: info
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./audit-service:/app/audit-service
      - ./audit-client:/app/audit-client

volumes:
  postgres_data:
