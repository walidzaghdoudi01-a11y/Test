id: rule_001
name: Suspicious Login Detection
description: Detects login attempts from unusual locations or with high failure count
severity: high
source: authentication
enabled: true
definition:
  event_types:
    - login_attempt
    - authentication_failure
  conditions:
    - field: event_type
      operator: equals
      value: authentication_failure
    - field: payload.failure_count
      operator: greater_than
      value: 3
  actions:
    - type: alert
      indicators:
        - suspicious_authentication
        - failed_login_attempts
      enrichment:
        recommendation: Investigate user account for compromised credentials
        action: Block user after 5 failed attempts
